name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -S agent_cli.py --help
      - run: node --check static/app.js
      - run: node --check static/charts.js
      - run: node --check static/pose.js
      - run: node --check static/trajectory.js
      - run: node --check static/trajectory_math.js
      - run: node --check static/fft.js
      - run: node --check static/fft_math.js
      - run: node --check static/allan.js
      - run: node --check static/firmware.js
      - run: node --check static/device.js
      - run: node tests/pose_math.mjs
      - run: node tests/fft_math.mjs
      - run: node tests/trajectory_math.mjs
      - run: node --check static/preferences.js
      - run: node --check static/locale.js
      - run: node --check static/fft_worker.js
      - run: node --check static/theme.js
      - run: node --check static/rotations.js
